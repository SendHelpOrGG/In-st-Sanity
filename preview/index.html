<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>In-st-Sanity — UI preview</title>
<style>
  /* ────────────────────────────────────────────────────────────────────────
     Palette — copied 1:1 from src/InStSanity/Resources/Styles/Colors.xaml
     ──────────────────────────────────────────────────────────────────────── */
  :root {
    --primary:            #5B8DEF;
    --primary-dark:       #3F6FD0;
    --primary-light:      #8FB1F7;

    --app-background:     #111318;
    --surface:            #191C22;
    --surface-elevated:   #20242B;
    --surface-hover:      #262B33;
    --stroke:             #2C313A;

    --sidebar-background: #15181D;
    --sidebar-stroke:     #23272E;
    --sidebar-selected:   #232B38;

    --text-primary:       #E9ECF1;
    --text-secondary:     #A3ABB8;
    --text-muted:         #6E7683;

    --font: "Segoe UI Variable Text", "Segoe UI", -apple-system, system-ui, Roboto, sans-serif;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 24px;
    background: radial-gradient(120% 120% at 20% 0%, #171A21 0%, #0B0D11 60%, #07080A 100%);
    font-family: var(--font);
    color: var(--text-secondary);
    -webkit-font-smoothing: antialiased;
  }

  /* ── App window (Window 1280×820, Win11 rounded corners) ───────────────── */
  .window {
    display: flex;
    flex-direction: column;
    width: 1280px;
    height: 820px;
    max-width: 96vw;
    max-height: calc(100vh - 90px);
    min-height: 520px;
    overflow: hidden;
    background: var(--app-background);
    border: 1px solid #2A2E36;
    border-radius: 10px;
    box-shadow: 0 30px 70px rgba(0, 0, 0, .65), 0 2px 0 rgba(255, 255, 255, .03) inset;
  }

  /* ── Windows title bar ─────────────────────────────────────────────────── */
  .titlebar {
    display: flex;
    align-items: center;
    flex: 0 0 32px;
    height: 32px;
    padding-left: 12px;
    background: var(--sidebar-background);
    border-bottom: 1px solid var(--sidebar-stroke);
    user-select: none;
  }

  .titlebar__icon { display: block; flex: 0 0 auto; }

  .titlebar__title {
    margin-left: 10px;
    font-size: 12px;
    color: var(--text-secondary);
    letter-spacing: .1px;
  }

  .titlebar__buttons { display: flex; margin-left: auto; height: 100%; }

  .caption {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 46px;
    height: 100%;
    color: var(--text-primary);
    transition: background .12s ease;
  }

  .caption:hover { background: #24272E; }
  .caption--close:hover { background: #C42B1C; }

  /* ── Shell body: side panel + main area ────────────────────────────────── */
  .body { display: flex; flex: 1 1 auto; min-height: 0; }

  /* Side panel — Shell.FlyoutWidth="264", FlyoutBackgroundColor=SideBarBackground */
  .sidebar {
    display: flex;
    flex-direction: column;
    flex: 0 0 264px;
    width: 264px;
    background: var(--sidebar-background);
    border-right: 1px solid var(--sidebar-stroke);
  }

  /* FlyoutHeader: brand block + divider */
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 20px 18px;
  }

  .brand__mark {                       /* Border StrokeShape="RoundRectangle 10", 40×40 */
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 0 0 40px;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    background: var(--primary);
    color: #FFFFFF;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: .5px;
  }

  .brand__name { font-size: 15px; font-weight: 700; color: var(--text-primary); line-height: 1.25; }
  .brand__sub  { font-size: 11px; color: var(--text-muted); line-height: 1.4; }

  .rule { flex: 0 0 1px; height: 1px; background: var(--sidebar-stroke); }

  /* Fly-out items — one per ShellContent */
  .nav { padding: 8px; display: flex; flex-direction: column; gap: 2px; }

  .nav__item {                         /* WinUI NavigationViewItem (dark) */
    display: flex;
    align-items: center;
    gap: 12px;
    height: 40px;
    padding: 0 12px;
    border-radius: 5px;
    font-size: 14px;
    color: var(--text-primary);
    cursor: default;
    transition: background .12s ease;
  }

  .nav__item:hover { background: #1E2229; }

  .nav__item--selected { background: var(--sidebar-selected); position: relative; }

  .nav__item--selected::before {       /* selection indicator */
    content: "";
    position: absolute;
    left: 0;
    top: 10px;
    bottom: 10px;
    width: 3px;
    border-radius: 2px;
    background: var(--primary);
  }

  .nav__icon { flex: 0 0 20px; display: block; opacity: .95; }

  /* FlyoutFooter */
  .sidebar__footer { margin-top: auto; padding: 16px 20px 18px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar__footer .label { font-size: 11px; color: var(--text-muted); }

  /* ── Main area ─────────────────────────────────────────────────────────── */
  .main { display: flex; flex-direction: column; flex: 1 1 auto; min-width: 0; background: var(--app-background); }

  .navbar {                            /* Shell nav bar: Title="{Binding Title}" */
    display: flex;
    align-items: center;
    flex: 0 0 48px;
    padding: 0 20px;
    background: var(--app-background);
  }

  .navbar__title { font-size: 16px; font-weight: 600; color: var(--text-primary); }

  .content {
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1 1 auto;
    min-height: 0;
    padding: 40px;
  }

  /* Placeholder bound to MainPageViewModel */
  .empty-state { text-align: center; display: flex; flex-direction: column; gap: 8px; }
  .empty-state__title { font-size: 18px; font-weight: 700; color: var(--text-secondary); }
  .empty-state__msg   { font-size: 13px; color: var(--text-muted); }

  .caption-note {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    color: #5A6273;
  }

  .caption-note code {
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 11px;
    color: #7C8494;
    background: rgba(255, 255, 255, .04);
    border: 1px solid #23272E;
    border-radius: 4px;
    padding: 2px 6px;
  }
</style>
</head>
<body>

<!-- ══ Window ══════════════════════════════════════════════════════════════ -->
<div class="window" role="img" aria-label="In-st-Sanity desktop app preview">

  <!-- Windows title bar (dark: RequestedTheme=Dark) -->
  <div class="titlebar">
    <svg class="titlebar__icon" width="16" height="16" viewBox="0 0 456 456" aria-hidden="true">
      <rect x="128" y="150" width="200" height="34" fill="#5B8DEF"/>
      <rect x="128" y="212" width="134" height="34" fill="#E9ECF1"/>
      <rect x="128" y="274" width="86"  height="34" fill="#A3ABB8"/>
    </svg>
    <span class="titlebar__title">In-st-Sanity</span>

    <div class="titlebar__buttons">
      <span class="caption"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0" y="4.6" width="10" height="1" fill="currentColor"/></svg></span>
      <span class="caption"><svg width="10" height="10" viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor"/></svg></span>
      <span class="caption caption--close"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0.5 0.5 L9.5 9.5 M9.5 0.5 L0.5 9.5" stroke="currentColor"/></svg></span>
    </div>
  </div>

  <div class="body">

    <!-- ══ Side panel (Shell fly-out, FlyoutBehavior=Locked) ══ -->
    <aside class="sidebar">

      <div class="brand">
        <div class="brand__mark">IS</div>
        <div>
          <div class="brand__name">In-st-Sanity</div>
          <div class="brand__sub">Desktop workspace</div>
        </div>
      </div>
      <div class="rule"></div>

      <nav class="nav">
        <div class="nav__item nav__item--selected">
          <!-- Resources/Images/icon_home.png -->
          <svg class="nav__icon" width="20" height="20" viewBox="0 0 96 96" aria-hidden="true">
            <path d="M48 12 L89 45 L89 84 L7 84 L7 45 Z" fill="#E9ECF1"/>
          </svg>
          <span>Home</span>
        </div>
      </nav>

      <div class="sidebar__footer">
        <div class="rule"></div>
        <div class="label">v1.0.0 &nbsp;·&nbsp; Dark theme</div>
      </div>
    </aside>

    <!-- ══ Main page ══ -->
    <main class="main">
      <div class="navbar"><span class="navbar__title">Home</span></div>

      <div class="content">
        <div class="empty-state">
          <div class="empty-state__title">Nothing here yet</div>
          <div class="empty-state__msg">The shell is ready. Build your content here.</div>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="caption-note">
  Static preview of the MAUI shell — colours taken from <code>Resources/Styles/Colors.xaml</code>
</div>

</body>
</html>
